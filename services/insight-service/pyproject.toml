[project]
name = "teampulse-insight-service"
version = "1.0.0"
description = "Insight Service: privacy-preserving personal and team analytics (query side)"
requires-python = ">=3.12"
dependencies = ["teampulse-common"]

[tool.uv.sources]
teampulse-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insight_service"]
