[project]
name = "teampulse-gateway"
version = "1.0.0"
description = "API gateway: edge JWT validation, routing, rate limiting, circuit breaking"
requires-python = ">=3.12"
dependencies = ["teampulse-common"]

[tool.uv.sources]
teampulse-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
