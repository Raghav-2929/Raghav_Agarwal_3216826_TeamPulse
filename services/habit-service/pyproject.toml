[project]
name = "teampulse-habit-service"
version = "1.0.0"
description = "Habit Service: private and team-shared wellness goals"
requires-python = ">=3.12"
dependencies = ["teampulse-common"]

[tool.uv.sources]
teampulse-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/habit_service"]
