[project]
name = "teampulse-event-tracking-service"
version = "1.0.0"
description = "Event Tracking Service: activity completions (command side)"
requires-python = ">=3.12"
dependencies = ["teampulse-common"]

[tool.uv.sources]
teampulse-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_tracking_service"]
