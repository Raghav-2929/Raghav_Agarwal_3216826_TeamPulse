[project]
name = "teampulse-streak-processor"
version = "1.0.0"
description = "Streak processor (AWS Lambda): streaks, badges, analytics rollups"
requires-python = ">=3.12"
dependencies = ["teampulse-common"]

[tool.uv.sources]
teampulse-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streak_processor"]
