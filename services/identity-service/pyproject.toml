[project]
name = "teampulse-identity-service"
version = "1.0.0"
description = "Identity Service: employee login, JWT issuance, users, teams, roles"
requires-python = ">=3.12"
dependencies = ["teampulse-common", "bcrypt>=4.2"]

[tool.uv.sources]
teampulse-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity_service"]
