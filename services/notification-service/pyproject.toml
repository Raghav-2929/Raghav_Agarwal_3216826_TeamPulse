[project]
name = "teampulse-notification-service"
version = "1.0.0"
description = "Notification Service: reminders, challenge updates, milestone messages"
requires-python = ">=3.12"
dependencies = ["teampulse-common"]

[tool.uv.sources]
teampulse-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notification_service"]
