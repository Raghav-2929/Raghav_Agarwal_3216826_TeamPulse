[project]
name = "teampulse-challenge-service"
version = "1.0.0"
description = "Challenge Service: team competitions, leaderboards, badge rules"
requires-python = ">=3.12"
dependencies = ["teampulse-common"]

[tool.uv.sources]
teampulse-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/challenge_service"]
