# TeamPulse — full local topology with one command:
#
#     docker compose up --build            (then: docker compose run --rm seed)
#
#   Frontend          http://localhost:8080      (SvelteKit SPA behind nginx, /api → gateway)
#   API gateway       http://localhost:8000      (Swagger for every service at /docs)
#   RabbitMQ UI       http://localhost:15672     (guest / guest)
#   Consul UI         http://localhost:8500      (service discovery + health checks)
#   Jaeger UI         http://localhost:16686     (distributed traces)
#
# AWS mapping: RabbitMQ topic exchange ≈ EventBridge bus (+ SQS queue per consumer), Consul ≈ ECS
# Service Connect/Cloud Map, DynamoDB Local ≈ DynamoDB, Postgres ≈ RDS, streak-processor worker ≈ Lambda.

name: teampulse

x-service-env: &service-env
  ENVIRONMENT: docker
  LOG_FORMAT: json
  LOG_LEVEL: INFO
  AUTO_CREATE_SCHEMA: "false"            # Alembic migrations run on start instead
  JWT_JWKS_URL: http://identity-service:8000/.well-known/jwks.json
  EVENT_BUS_DRIVER: rabbitmq
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  CONSUL_URL: http://consul:8500
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  CORS_ORIGINS: http://localhost:8080,http://localhost:5173
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_PASSWORD: ${SERVICE_DB_PASSWORD:-teampulse-local}
  AWS_REGION: eu-west-1
  AWS_ACCESS_KEY_ID: local                # DynamoDB Local accepts any credentials
  AWS_SECRET_ACCESS_KEY: local

x-service: &service
  restart: unless-stopped
  depends_on: &service-deps
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    consul: { condition: service_started }
  deploy:
    resources:
      limits: { cpus: "0.50", memory: 384M }

services:
  # ------------------------------------------------------------------ infrastructure
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-local}
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:-teampulse-local}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 12

  consul:
    image: hashicorp/consul:1.20
    command: agent -dev -client=0.0.0.0 -ui
    ports: ["8500:8500"]

  dynamodb:
    image: amazon/dynamodb-local:2.5.3
    command: -jar DynamoDBLocal.jar -sharedDb -inMemory
    ports: ["8001:8000"]

  dynamodb-init:            # creates the analytics single table (same key schema as in AWS)
    image: amazon/aws-cli:2.22.0
    depends_on: [dynamodb]
    environment: { AWS_ACCESS_KEY_ID: local, AWS_SECRET_ACCESS_KEY: local, AWS_DEFAULT_REGION: eu-west-1 }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until aws dynamodb list-tables --endpoint-url http://dynamodb:8000 >/dev/null 2>&1; do sleep 1; done;
        aws dynamodb create-table --endpoint-url http://dynamodb:8000 --table-name teampulse-analytics
        --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S
        --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE
        --billing-mode PAY_PER_REQUEST >/dev/null 2>&1 || true; echo "analytics table ready"
    restart: "no"

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["16686:16686", "4318:4318"]

  # ------------------------------------------------------------------ microservices
  identity-service:
    <<: *service
    build: { context: ., dockerfile: services/identity-service/Dockerfile }
    image: teampulse/identity-service:${TAG:-latest}
    command: ["sh", "-c", "python -m identity_service.migrate && exec uvicorn identity_service.main:create_app --factory --host 0.0.0.0 --port 8000 --no-access-log"]
    environment:
      <<: *service-env
      SERVICE_NAME: identity-service
      HOST_ADDRESS: identity-service
      DB_NAME: identity
      DB_USER: identity_svc
      SEED_DEMO_DATA: "true"
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}   # empty → a key is generated once and kept in the volume
    volumes: [identity-data:/data]

  habit-service:
    <<: *service
    build: { context: ., dockerfile: services/habit-service/Dockerfile }
    image: teampulse/habit-service:${TAG:-latest}
    command: ["sh", "-c", "python -m habit_service.migrate && exec uvicorn habit_service.main:create_app --factory --host 0.0.0.0 --port 8000 --no-access-log"]
    environment: { <<: *service-env, SERVICE_NAME: habit-service, HOST_ADDRESS: habit-service, DB_NAME: habits, DB_USER: habit_svc }
    depends_on: { <<: *service-deps, identity-service: { condition: service_healthy } }

  event-tracking-service:
    <<: *service
    build: { context: ., dockerfile: services/event-tracking-service/Dockerfile }
    image: teampulse/event-tracking-service:${TAG:-latest}
    command: ["sh", "-c", "python -m event_tracking_service.migrate && exec uvicorn event_tracking_service.main:create_app --factory --host 0.0.0.0 --port 8000 --no-access-log"]
    environment:
      <<: *service-env
      SERVICE_NAME: event-tracking-service
      HOST_ADDRESS: event-tracking-service
      DB_NAME: event_tracking
      DB_USER: event_tracking_svc
      HABIT_SERVICE_URL: http://habit-service:8000
      ACTIVITY_BACKFILL_DAYS: "30"
    depends_on: { <<: *service-deps, identity-service: { condition: service_healthy } }

  challenge-service:
    <<: *service
    build: { context: ., dockerfile: services/challenge-service/Dockerfile }
    image: teampulse/challenge-service:${TAG:-latest}
    command: ["sh", "-c", "python -m challenge_service.migrate && exec uvicorn challenge_service.main:create_app --factory --host 0.0.0.0 --port 8000 --no-access-log"]
    environment: { <<: *service-env, SERVICE_NAME: challenge-service, HOST_ADDRESS: challenge-service, DB_NAME: challenges, DB_USER: challenge_svc }
    depends_on: { <<: *service-deps, identity-service: { condition: service_healthy } }

  notification-service:
    <<: *service
    build: { context: ., dockerfile: services/notification-service/Dockerfile }
    image: teampulse/notification-service:${TAG:-latest}
    command: ["sh", "-c", "python -m notification_service.migrate && exec uvicorn notification_service.main:create_app --factory --host 0.0.0.0 --port 8000 --no-access-log"]
    environment:
      <<: *service-env
      SERVICE_NAME: notification-service
      HOST_ADDRESS: notification-service
      DB_NAME: notifications
      DB_USER: notification_svc
      REMINDER_SCHEDULER: internal
    depends_on: { <<: *service-deps, identity-service: { condition: service_healthy } }

  insight-service:
    <<: *service
    build: { context: ., dockerfile: services/insight-service/Dockerfile }
    image: teampulse/insight-service:${TAG:-latest}
    environment:
      <<: *service-env
      SERVICE_NAME: insight-service
      HOST_ADDRESS: insight-service
      ANALYTICS_STORE_DRIVER: dynamodb
      AWS_ENDPOINT_URL: http://dynamodb:8000
      MIN_COHORT_SIZE: "3"
    depends_on:
      identity-service: { condition: service_healthy }
      dynamodb-init: { condition: service_completed_successfully }
      consul: { condition: service_started }

  streak-processor:            # hosts the Lambda's code as a RabbitMQ worker
    <<: *service
    build: { context: ., dockerfile: services/streak-processor/Dockerfile }
    image: teampulse/streak-processor:${TAG:-latest}
    environment:
      <<: *service-env
      SERVICE_NAME: streak-processor
      HOST_ADDRESS: streak-processor
      ANALYTICS_STORE_DRIVER: dynamodb
      AWS_ENDPOINT_URL: http://dynamodb:8000
    depends_on:
      rabbitmq: { condition: service_healthy }
      dynamodb-init: { condition: service_completed_successfully }

  gateway:
    <<: *service
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    image: teampulse/gateway:${TAG:-latest}
    environment:
      <<: *service-env
      SERVICE_NAME: gateway
      HOST_ADDRESS: gateway
      SERVICE_DISCOVERY: consul         # resolves healthy instances from Consul; static URLs as fallback
      IDENTITY_SERVICE_URL: http://identity-service:8000
      HABIT_SERVICE_URL: http://habit-service:8000
      CHALLENGE_SERVICE_URL: http://challenge-service:8000
      EVENT_TRACKING_SERVICE_URL: http://event-tracking-service:8000
      INSIGHT_SERVICE_URL: http://insight-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
      LOGIN_RATE_LIMIT_PER_MINUTE: "60"
    ports: ["8000:8000"]
    depends_on:
      identity-service: { condition: service_healthy }
      consul: { condition: service_started }

  frontend:
    build: { context: ./frontend, dockerfile: web/Dockerfile }
    image: teampulse/frontend:${TAG:-latest}
    ports: ["8080:8080"]
    depends_on: [gateway]
    restart: unless-stopped

  seed:                        # optional: docker compose run --rm seed
    profiles: ["tools"]
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    image: teampulse/gateway:${TAG:-latest}
    entrypoint: ["python", "/scripts/seed_demo.py", "--gateway", "http://gateway:8000"]
    volumes: ["./scripts:/scripts:ro"]
    depends_on: [gateway]

volumes:
  pgdata:
  identity-data:
